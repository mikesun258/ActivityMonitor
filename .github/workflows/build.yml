name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 清理旧缓存，避免缓存污染
      - name: Clean old Gradle cache
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper/dists

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Configure Gradle Wrapper Mirror
        run: |
          sed -i 's|https://services.gradle.org/distributions/|https://mirrors.aliyun.com/maven/gradle/|g' gradle/wrapper/gradle-wrapper.properties

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 禁用离线 + 代理加速拉取 Google Maven 依赖
      - name: Build APK
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace --no-offline
        env:
          GRADLE_OPTS: >
            -Dhttp.proxyHost=mirror.ghproxy.com
            -Dhttp.proxyPort=80
            -Dhttps.proxyHost=mirror.ghproxy.com
            -Dhttps.proxyPort=80
            -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ActivityMonitor-APK
          path: app/build/outputs/apk/release/
