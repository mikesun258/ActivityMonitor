name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      # 1. 配置 Gradle 镜像，解决下载超时
      - name: Configure Gradle Mirror
        run: |
          sed -i 's|https://services.gradle.org/distributions/|https://mirrors.aliyun.com/maven/gradle/|g' gradle/wrapper/gradle-wrapper.properties

      # 2. 添加 Gradle 缓存，避免重复下载依赖
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 3. 构建命令，增加超时参数
      - name: Build APK
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace --timeout 180s

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ActivityMonitor-APK
          path: app/build/outputs/apk/release/
